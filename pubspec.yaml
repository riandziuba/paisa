name: flutter_paisa
description: A expense manager app for Android.

publish_to: 'none'

version: 1.5.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  local_auth_android: ^1.0.6
  chart_sparkline: ^1.0.8
  fl_chart: ^0.68.0
  csv: ^5.0.1
  date_picker_timeline: ^1.2.3
  device_info_plus: ^11.0.0
  dynamic_color: ^1.7.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^18.0.0
  flutter_localizations:
    sdk: flutter
  get_it: ^7.6.0
  glassmorphism: ^3.0.0
  google_fonts: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.0
  intl: ^0.20.0
  local_auth: ^2.3.0
  material_color_utilities: ^0.13.0
  material_design_icons_flutter: ^7.0.7296
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  responsive_builder: ^0.7.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0
  url_strategy: ^0.2.0
  flutter_timezone: ^5.0.1
  flutter_plugin_android_lifecycle: ^2.0.19

dev_dependencies:
  build_runner: ^2.4.0
  change_app_package_name: any
  flutter_launcher_icons: ^0.13.0
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.3.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/icon.png
  color_dark: "#000000"
  android: true
  ios: true

flutter_icons:
  image_path: "assets/images/icon.png"
  ios: true
  android: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/